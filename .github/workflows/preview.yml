name: Preview

# One build per PR to main that touches the site, feeding two consumers:
#   1. Size benchmark (astro/bench/SIZE-BENCH-SPEC.md): sizes.json diffed against the
#      one deployed to production, sticky PR comment, fails on a budget breach.
#   2. Cloudflare Pages *preview* deployment with --branch <pr-branch>, so Cloudflare
#      mints a per-branch preview URL, posted back as a sticky PR comment.
# Both share the single build so a PR fetches the ScriptureEarth dump once.
#
# Configuration:
#   secrets.SE_KEY                 API key for the dump endpoint. Absent → the whole
#                                  build skips (green) with a notice.
#   secrets.CLOUDFLARE_API_TOKEN   token with Account · Cloudflare Pages · Edit
#   secrets.CLOUDFLARE_ACCOUNT_ID  Cloudflare account id. Either absent → the size
#                                  benchmark still runs; only the preview deploy skips.
#   vars.SE_BASE / vars.SE_DUMP_PATH  (optional) endpoint overrides
#   vars.SIZE_BENCH_BASELINE_URL      (optional) baseline sizes.json URL
#                                     (default: prod origin /assets/sizes.json)
#
# Fork-PR caveat: on a pull_request from a fork, secrets are unavailable, so the
# gate skips. Same-repo branches work as-is.
#
# workflow_dispatch runs the build + size benchmark only (no preview, no comments).

on:
  pull_request:
    branches: [main]
    paths:
      - 'astro/**'
      - '.github/workflows/preview.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Legacy-URL redirect resolver tests (functions-lib/). No dependencies, secrets or
  # extract needed, so this runs on every PR, including forks.
  redirect-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test legacy redirects
        working-directory: astro
        run: node --test "functions-lib/*.test.mjs"

      - name: Test dump field report
        working-directory: astro
        run: node --test scripts/dump_fields.test.mjs

  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Check prerequisites
        id: check
        env:
          SE_KEY: ${{ secrets.SE_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$SE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Build skipped — set secrets.SE_KEY to enable the size benchmark and Cloudflare PR previews."
          fi
          if [ "$EVENT" = "pull_request" ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            if [ "$EVENT" = "pull_request" ]; then
              echo "::notice::Preview deploy skipped — set secrets.CLOUDFLARE_API_TOKEN and secrets.CLOUDFLARE_ACCOUNT_ID to enable Cloudflare PR previews."
            fi
          fi

  build:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build site
        uses: ./.github/actions/build-site
        with:
          se-key: ${{ secrets.SE_KEY }}
          se-base: ${{ vars.SE_BASE }}
          se-dump-path: ${{ vars.SE_DUMP_PATH }}

      # Lists dump fields extract.mjs doesn't read (new link types, new columns) in the
      # job summary, with a warning annotation each. Informational: never blocks the preview.
      - name: Report unused dump fields
        continue-on-error: true
        working-directory: astro
        run: node scripts/dump_fields.mjs

      # --- Size benchmark -------------------------------------------------------
      # build_sizes.mjs sizes the PRE-brotli dist/, so it runs before precompress.
      - name: Produce sizes.json
        working-directory: astro
        run: node scripts/build_sizes.mjs

      # Diff vs the prod baseline; render the markdown report + verdict. With --verdict
      # the script exits 0 on a breach so the comment below still posts; the last step
      # enforces. A missing/404 baseline is report-only (spec §4).
      - name: Compare against baseline
        working-directory: astro
        run: node scripts/check_sizes.mjs --report size-report.md --verdict size-verdict.txt
        env:
          SIZE_BENCH_BASELINE_URL: ${{ vars.SIZE_BENCH_BASELINE_URL }}

      - name: Post size comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: size-benchmark
          path: astro/size-report.md

      # --- Preview deploy ---------------------------------------------------------
      # Same as `pnpm run predeploy` minus build_sizes.mjs, which already ran above.
      - name: Precompress dist
        if: needs.gate.outputs.deploy == 'true'
        working-directory: astro
        run: node scripts/precompress_dist.mjs

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        if: needs.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: astro
          packageManager: pnpm
          command: pages deploy dist --project-name=se-proto-en --branch=${{ github.head_ref }}

      - name: Comment preview URL
        if: needs.gate.outputs.deploy == 'true' && steps.deploy.outputs.deployment-url != ''
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const marker = '<!-- cf-preview -->';
            // The branch alias always serves the newest deploy. Fall back to the
            // per-commit URL only if Cloudflare didn't return an alias.
            const url = process.env.ALIAS_URL || process.env.PREVIEW_URL;
            const lines = [marker, '### ⚡ Cloudflare preview', '', url, '', '_Redeploys on each push._'];
            const body = lines.join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }

      # Last, so the size comment and the preview are both out before a breach fails the job.
      - name: Enforce size budget
        working-directory: astro
        run: |
          if [ "$(cat size-verdict.txt)" = "fail" ]; then
            echo "::error::Cold-load size exceeds the fail-band budget"
            exit 1
          fi
